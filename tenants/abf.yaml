# Tenant: ABF Analytics
# Adding/changing a tenant is ONE yaml file + ONE pull request. No new directories, no
# copy-paste, no code generation. The Terraform root loops over every file in this directory.
#
# Schema v2 (ADR-0002, amended by ADR-0011): `environments` is a MAP; `defaults` sets the
# baseline and each environment shallow-merges its overrides. Layers are objects {opt_in,
# isolation?}. Platform-module versions are fleet-wide in VERSIONS.md, NOT per-tenant here.
# `units` declares axis-2 workloads; a unit's `version` is its app release (optional).
slug: abf
display_name: "ABF Analytics"
owner_group: abf-data-engineers@company.com
data_classification: confidential # may share the runtime plane (ADR-0001 D14)
cmek_location: europe-west4

# Baseline applied to every environment below, unless that environment overrides the key.
defaults:
  budget_usd: 5000
  layers:
    storage: { opt_in: true }
    ingestion: { opt_in: true }
    bigquery: { opt_in: true }
    compute: { opt_in: true, isolation: shared }
    composer: { opt_in: false, isolation: shared }
  units: {}
  feature_flags: {}

# The tenant exists in exactly these environments. `{}` = take all defaults.
environments:
  dev:
    # dev runs ahead: one agent-unit on a newer app release than prod.
    # task_queue explicit here (ADR-0016 D16-3); prod below omits it and falls back to the
    # unit name "search-a" — both are valid, showing the default in practice.
    #
    # cs-agent-api / cs-agent-worker: the first REAL agent workload (ADR-0020) — one image,
    # two units. task_queue matches on both (the API enqueues, the worker polls); both share
    # one pre-created Secret (secret_ref) for OPENAI_API_KEY/POSTGRES_URL/REDIS_URL/the D16-5
    # codec key. The worker is headless (expose_port: false) — no HTTP surface, no Service.
    units:
      search-a: { type: agent-unit, version: 1.4.0, opt_in: true, task_queue: search-a-queue }
      cs-agent-api:
        type: agent-unit
        version: 0.2.0
        image: cs-agent-backend
        opt_in: true
        task_queue: cs-agent
        port: 8000
        secret_ref: cs-agent-secrets
      cs-agent-worker:
        type: agent-unit
        version: 0.2.0
        image: cs-agent-backend
        opt_in: true
        task_queue: cs-agent
        command: ["python", "-m", "durable.worker"]
        expose_port: false
        secret_ref: cs-agent-secrets
  acc: {}
  prod:
    budget_usd: 8000
    layers:
      # Composer is PARKED platform-wide (ADR-0016: Temporal owns agentic orchestration), so
      # this stays opted OUT — the registry never claims a layer nothing provisions (helix
      # precedent). Re-opt-in only if/when Composer is unparked for batch data pipelines.
      composer: { opt_in: false, isolation: shared }
    units:
      search-a: { type: agent-unit, version: 1.3.0, opt_in: true } # prod held one app release back
