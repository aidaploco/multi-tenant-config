# Tenant: Helix Health
# data_classification: restricted -> regulated data (e.g. health records). Per ADR-0001 D14,
# restricted tenants get DEDICATED compute (their own Composer/GKE in the tenant project),
# never the shared runtime plane. The guardrail in the tenant module fails the plan otherwise.
#
# Schema v2 (ADR-0002, amended by ADR-0011): see tenants/README.md.
slug: helix
display_name: "Helix Health"
owner_group: helix-data-engineers@company.com
data_classification: restricted
cmek_location: europe-west4

defaults:
  budget_usd: 12000
  layers:
    storage: { opt_in: true }
    ingestion: { opt_in: false }
    bigquery: { opt_in: true }
    # Dedicated compute/composer for restricted tenants is DESIGNED (D14) but the provisioning
    # path is NOT BUILT — these stay opted OUT so the registry never claims isolation nothing
    # enforces. Flip opt_in when the dedicated path ships; the isolation value is the recorded
    # intent, and the module guardrail will refuse `shared` for this tenant either way.
    compute: { opt_in: false, isolation: dedicated }
    composer: { opt_in: false, isolation: dedicated }
  units: {}
  feature_flags: {}

# Restricted tenant: dev + prod only, no acc. Identical config in both (no per-env overrides).
environments:
  dev: {}
  prod: {}
