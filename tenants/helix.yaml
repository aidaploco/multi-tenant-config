# Tenant: Helix Health
# data_classification: restricted -> regulated data (e.g. health records). Per
# ADR-0001 D14, restricted tenants get DEDICATED compute (their own Composer/GKE
# in the tenant project), never the shared runtime plane.
slug: helix
display_name: "Helix Health"
owner_group: helix-data-engineers@company.com

environments: [dev, prod]

layers:
  storage: true
  ingestion: false
  bigquery: true
  compute:
    enabled: true
    isolation: dedicated
  composer:
    enabled: true
    isolation: dedicated

cmek_location: europe-west4
budget_usd: 12000
data_classification: restricted
