# platform-system network isolation (ADR-0023 D23-3). Until now the platform's own namespace
# was the only default-allow namespace on the cluster — tenant namespaces got default-deny
# (ADR-0013/0022) while the namespace hosting the shared Temporal control plane had no
# NetworkPolicies at all. The reference-platform review that produced ADR-0023 flagged exactly
# this shape ("a guardrail that exempts the platform's own namespaces is a hole").
#
# Doctrine: default-deny BOTH directions + exceptions scoped to the exact pod AND port — never
# "this namespace is trusted". Any future platform-system workload (an OTel collector, a
# metrics proxy, …) must bring its own scoped allow rule in this file; if it can't say which
# pod and which port, it isn't ready to be deployed here.
#
# Effective tenant→Temporal reachability is now the INTERSECTION of two policies: the
# tenant-namespace module's egress allow (namespace-level, toward platform-system) and this
# file's ingress allow (pod+port). Net result: tenant pods reach temporal-frontend:7233 and
# nothing else in platform-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: platform-system
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Tenant workloads (workers, APIs) speak gRPC to the Temporal frontend. Port 8233 (the
# dev-server web UI) is deliberately NOT opened: humans reach it via `kubectl port-forward`,
# which rides the kubelet path and is not subject to CNI policy — no cluster-network exposure
# needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tenants-to-temporal-frontend
  namespace: platform-system
spec:
  podSelector:
    matchLabels:
      app: temporal-dev-server
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: tenant
                operator: Exists
      ports:
        - port: 7233
          protocol: TCP
---
# ------------------------------------------------------------------------------------------
# Monitoring plane dataflows (ADR-0024 D24-3). Each rule is one exact edge of the graph
#   human --(port-forward, not CNI-governed)--> Grafana --> prom-label-proxy --> Prometheus
#   Prometheus --> kubelet cAdvisor (node) + the Kubernetes API (node discovery)
# NO rule admits tenant namespaces to any monitoring pod: the proxy trusts the caller-supplied
# namespace parameter, so workload-to-proxy reachability IS the tenant boundary. The reference
# platform left this open in-cluster; here the default-deny above closes it and these rules
# open exactly the graph edges, nothing more.
# ------------------------------------------------------------------------------------------
# Only Grafana may query the proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-to-proxy
  namespace: platform-system
spec:
  podSelector:
    matchLabels:
      app: prom-label-proxy
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - port: 8080
          protocol: TCP
---
# Only the proxy may query Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxy-to-prometheus
  namespace: platform-system
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prom-label-proxy
      ports:
        - port: 9090
          protocol: TCP
---
# Egress mirrors, per component (the default-deny above blocks even same-namespace egress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-egress
  namespace: platform-system
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: prom-label-proxy
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-egress
  namespace: platform-system
spec:
  podSelector:
    matchLabels:
      app: prom-label-proxy
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 9090
          protocol: TCP
---
# Prometheus scrapes the kubelet (cAdvisor, node port 10250) and watches the API server for
# node discovery (endpoint = the control-plane node, port 6443). Both live at NODE addresses,
# outside pod/namespace selectors, so this must be an ipBlock: 172.21.0.0/16 is THIS kind
# cluster's docker network (checked live, not assumed). Local-plane-only by design — at
# activation the whole scraper is replaced by Managed Prometheus (ADR-0024 D24-5) and this
# rule goes with it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-egress
  namespace: platform-system
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 172.21.0.0/16
      ports:
        - port: 10250 # kubelet cAdvisor
          protocol: TCP
        - port: 6443 # API server (node discovery)
          protocol: TCP
