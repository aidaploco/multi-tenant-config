# GENERATED — do not edit (ADR-0017, ADR-0020). Rendered from the tenant registry by
# scripts/render-payload.rb; edit tenants/<slug>.yaml and re-render. CI rejects drift.
#
# serviceAccountName is the unit's own KSA (agent-identity binds the matching GCP SA at
# activation) — never the namespace default SA: blocked cluster-wide by deny-default-sa
# (ADR-0015) and, more specifically, the exact-KSA constraint (ADR-0018).
#
# TEMPORAL_* env vars wire durable-execution connectivity (ADR-0016 D16-3, ADR-0019): the
# local dev server here, a Temporal Cloud endpoint at activation — same three vars either way.
#
# envFrom references a Secret a human pre-creates (never the registry, never committed —
# ADR-0020); `optional: true` so a missing Secret doesn't block the pod from starting.
#
# manifest_ref/packs_ref (ADR-0021, GitOps-tracked since ADR-0022 D22-2) render real
# ConfigMaps from gitops/config/<tenant>/<ref>/ — reviewable committed content, not an
# externally-created artifact. Wired up only when the unit actually declares them.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lana-manifest
  namespace: abf
  annotations:
    configsync.gke.io/cluster-name-selector: runtime-dev
  labels:
    tenant: abf
    environment: dev
data:
  manifest.yaml: |
    # Lana — the V1 customer-service Employee: the reference app's
    # billing/support/supervisor behavior expressed as manifest + packs.
    schema_version: 1
    employee:
      name: lana
      role: "Customer service assistant for Brightloop, a webhook delivery and API orchestration platform"
      persona:
        display_name: "Lana"
        tone: "direct, warm, leads with the answer, one issue at a time"
    runtime:
      model_tier: standard
      temperature: 0.3
      max_output_tokens: 1024
      # Supervisor ran on the light tier until 2026-07-10: it misrouted pricing
      # and plan questions to billing. Routing quality is a model problem, not a
      # prompt problem (the reference app learned the same lesson).
      history_budget:
        max_turns: 40
        summary_max_tokens: 512
    capabilities:
      - pack: billing
        config: {}
      - pack: support
        config: {}
      - pack: introspection
        config: {}
    routing:
      entry: supervisor
      agents:
        supervisor: {capabilities: [introspection]}
        billing: {capabilities: [billing]}
        support: {capabilities: [support]}
      edges:
        - [supervisor, billing]
        - [supervisor, support]
        - [billing, supervisor]
        - [support, supervisor]
      max_hops_per_message: 3
    channels: [http]
    guardrails:
      - pack: message_length
        config: {max_chars: 1000}
      - pack: prompt_injection
        config: {threshold: 0.7}
      - pack: off_topic
        config:
          threshold: 0.5
          topic: "Brightloop customer service: product, billing, support, account"
    memory:
      substrate: pgvector
      collection: lana
    escalation:
      approvers_channel: http
      remind_after: PT4H
      expire_after: P2D
      approval_required_tools: []
    kpis:
      task_types: [conversation]
    schedules: []
