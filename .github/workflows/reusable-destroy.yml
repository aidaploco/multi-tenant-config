name: reusable-destroy

# Targeted destroy of ONE tenant's infrastructure in ONE environment (ADR-0026 D26-1). The
# "targeting" is ADR-0014's payoff: each tenant is its own workspace, so a full `plan -destroy`
# in that workspace touches exactly one tenant's state and nothing else — no -target flags, no
# resource lists to keep in sync.
#
# Runs as the APPLIER SA behind the same GitHub environment approval gate as apply (a prod
# destroy needs a prod reviewer). The OPA gate runs with allow_destroy — the ONLY caller allowed
# to set it (the opa-gate action documents why: external data, so a PR can never waive its own
# gate). Ends by DELETING the workspace: `terraform workspace delete` refuses while state still
# holds resources, so a partial destroy fail-closes instead of leaving a live-but-invisible
# tenant behind — the orphan-workspace failure mode this pipeline exists to prevent.
#
# Idempotent: a re-run after the workspace is already gone is a clean no-op (recovery from a
# partial earlier run must not require manual state surgery).

on:
  workflow_call:
    inputs:
      environment:
        description: dev | acc | prod
        required: true
        type: string
      workspace:
        description: The tenant workspace to destroy and delete (ADR-0014).
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    name: destroy-tenants-${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # protection rules here = the approval gate
    env:
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_billing_account: ${{ vars.BILLING_ACCOUNT }}
      TF_VAR_parent_folder_id: ${{ vars.PARENT_FOLDER_ID }}
      TF_VAR_keys_project_id: ${{ vars.KEYS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.APPLIER_SA }}

      - name: Auth git for private modules # no-op if MODULES_READ_TOKEN is unset (public repo)
        env:
          TOKEN: ${{ secrets.MODULES_READ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Terraform init
        working-directory: terraform/tenants
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=tenants/${{ inputs.environment }}"

      - name: Select workspace (no-op if already deleted)
        id: ws
        working-directory: terraform/tenants
        run: |
          if terraform workspace list | sed 's/^[* ] *//' | grep -qx "${{ inputs.workspace }}"; then
            terraform workspace select "${{ inputs.workspace }}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "workspace '${{ inputs.workspace }}' not found in tenants/${{ inputs.environment }} — already offboarded, nothing to do"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform plan -destroy
        if: steps.ws.outputs.exists == 'true'
        working-directory: terraform/tenants
        run: |
          terraform plan -destroy -input=false -out=plan.tfplan
          terraform show -json plan.tfplan > plan.json

      - name: Resolve policy version
        if: steps.ws.outputs.exists == 'true'
        id: policy
        run: |
          ref="${{ vars.POLICY_REF }}"
          if [ -z "$ref" ]; then
            ref=$(grep -oE '`v[0-9]+\.[0-9]+\.[0-9]+`' VERSIONS.md | tr -d '`' | sort -V | tail -1)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # allow_destroy waives ONLY the destroy-count threshold; every other deny still applies.
      - name: Policy gate (OPA) — deliberate-teardown mode
        if: steps.ws.outputs.exists == 'true'
        uses: ./.github/actions/opa-gate
        with:
          plan_json: terraform/tenants/plan.json
          policy_ref: ${{ steps.policy.outputs.ref }}
          token: ${{ secrets.MODULES_READ_TOKEN }}
          allow_destroy: "true"

      - name: Terraform apply (destroy)
        if: steps.ws.outputs.exists == 'true'
        working-directory: terraform/tenants
        run: terraform apply -input=false plan.tfplan

      # Refuses while state is non-empty (fail-closed): a partially-destroyed tenant stays
      # visible as a workspace (and to the orphan check) rather than silently vanishing.
      - name: Delete workspace
        if: steps.ws.outputs.exists == 'true'
        working-directory: terraform/tenants
        run: |
          terraform workspace select default
          terraform workspace delete "${{ inputs.workspace }}"
