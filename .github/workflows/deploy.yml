name: deploy

# On merge to main: apply each root dev -> acc -> prod (ADR-0001 D9). The tenant root applies PER
# TENANT (one workspace each, ADR-0014) — tenants within an env apply in parallel with isolated
# state; the env ordering (all dev before any acc) is enforced by `needs:`. dev is automatic; acc
# and prod wait on their GitHub Environment approval gate. Gated on WIF_PROVIDER (dormant until set).

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.gen.outputs.envs }}
    steps:
      - uses: actions/checkout@v5
      - id: gen
        run: echo "envs=$(ruby scripts/list-tenant-envs.rb)" >> "$GITHUB_OUTPUT"

  # --- tenant root (per tenant, ordered by env) ---
  deploy-tenants-dev:
    needs: list
    if: ${{ vars.WIF_PROVIDER != '' }}
    strategy:
      fail-fast: false
      matrix:
        tenant: ${{ fromJSON(needs.list.outputs.envs).dev }}
    uses: ./.github/workflows/reusable-apply.yml
    with: { environment: dev, workspace: "${{ matrix.tenant }}" }
    secrets: inherit
  deploy-tenants-acc:
    needs: [list, deploy-tenants-dev]
    if: ${{ vars.WIF_PROVIDER != '' }}
    strategy:
      fail-fast: false
      matrix:
        tenant: ${{ fromJSON(needs.list.outputs.envs).acc }}
    uses: ./.github/workflows/reusable-apply.yml
    with: { environment: acc, workspace: "${{ matrix.tenant }}" }
    secrets: inherit
  deploy-tenants-prod:
    needs: [list, deploy-tenants-acc]
    if: ${{ vars.WIF_PROVIDER != '' }}
    strategy:
      fail-fast: false
      matrix:
        tenant: ${{ fromJSON(needs.list.outputs.envs).prod }}
    uses: ./.github/workflows/reusable-apply.yml
    with: { environment: prod, workspace: "${{ matrix.tenant }}" }
    secrets: inherit

  # --- runtime root (per env) ---
  runtime-dev:
    if: ${{ vars.WIF_PROVIDER != '' }}
    uses: ./.github/workflows/reusable-apply.yml
    with: { environment: dev, root_dir: terraform/runtime, state_prefix: runtime }
    secrets: inherit
  runtime-acc:
    if: ${{ vars.WIF_PROVIDER != '' }}
    needs: runtime-dev
    uses: ./.github/workflows/reusable-apply.yml
    with: { environment: acc, root_dir: terraform/runtime, state_prefix: runtime }
    secrets: inherit
  runtime-prod:
    if: ${{ vars.WIF_PROVIDER != '' }}
    needs: runtime-acc
    uses: ./.github/workflows/reusable-apply.yml
    with: { environment: prod, root_dir: terraform/runtime, state_prefix: runtime }
    secrets: inherit

  # --- per-tenant namespaces (needs the env's tenants + that env's cluster) ---
  tenant-runtime-dev:
    if: ${{ vars.WIF_PROVIDER != '' }}
    needs: [deploy-tenants-dev, runtime-dev]
    uses: ./.github/workflows/reusable-apply.yml
    with: { environment: dev, root_dir: terraform/tenant-runtime, state_prefix: tenant-runtime }
    secrets: inherit
  tenant-runtime-acc:
    if: ${{ vars.WIF_PROVIDER != '' }}
    needs: [deploy-tenants-acc, runtime-acc]
    uses: ./.github/workflows/reusable-apply.yml
    with: { environment: acc, root_dir: terraform/tenant-runtime, state_prefix: tenant-runtime }
    secrets: inherit
  tenant-runtime-prod:
    if: ${{ vars.WIF_PROVIDER != '' }}
    needs: [deploy-tenants-prod, runtime-prod]
    uses: ./.github/workflows/reusable-apply.yml
    with: { environment: prod, root_dir: terraform/tenant-runtime, state_prefix: tenant-runtime }
    secrets: inherit
