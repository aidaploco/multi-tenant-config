name: deploy

# On merge to main: apply dev -> acc -> prod, IN ORDER (ADR-0001 D9). dev is automatic; acc and
# prod each wait on their GitHub Environment's required-reviewers gate before their job starts.
# `needs:` enforces the ordering; a failed/blocked earlier stage stops the later ones.

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  dev:
    uses: ./.github/workflows/reusable-apply.yml
    with:
      environment: dev
    secrets: inherit

  acc:
    needs: dev
    uses: ./.github/workflows/reusable-apply.yml
    with:
      environment: acc
    secrets: inherit

  prod:
    needs: acc
    uses: ./.github/workflows/reusable-apply.yml
    with:
      environment: prod
    secrets: inherit
