name: drift

# Scheduled drift detection. A read-only plan with -detailed-exitcode (0 = in sync, 2 = drift,
# 1 = error) per (tenant, environment) — one workspace each (ADR-0014) — AND per shared root
# (runtime, tenant-runtime) per environment. The shared runtime plane is the largest blast
# radius; it must never be the part drift-checking skips. Opens a tracking issue on drift. Runs
# as the planner SA — it only ever looks.

on:
  schedule:
    - cron: "0 6 * * 1-5" # 06:00 UTC, weekday mornings
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.gen.outputs.envs }}
    steps:
      - uses: actions/checkout@v5
      - id: gen
        run: echo "envs=$(ruby scripts/list-tenant-envs.rb)" >> "$GITHUB_OUTPUT"

  detect:
    needs: list
    if: ${{ vars.WIF_PROVIDER != '' }} # dormant until the one-time repo setup is done
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.envs)._pairs }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PLANNER_SA }}

      - name: Auth git for private modules
        env:
          TOKEN: ${{ secrets.MODULES_READ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Detect drift (${{ matrix.tenant }} / ${{ matrix.environment }})
        id: drift
        working-directory: terraform/tenants
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=tenants/${{ matrix.environment }}"
          terraform workspace select -or-create "${{ matrix.tenant }}"
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode \
            -var="environment=${{ matrix.environment }}" \
            -var="billing_account=${{ vars.BILLING_ACCOUNT }}" \
            -var="parent_folder_id=${{ vars.PARENT_FOLDER_ID }}" \
            -var="keys_project_id=${{ vars.KEYS_PROJECT_ID }}"
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open drift issue
        if: steps.drift.outputs.exitcode == '2'
        uses: actions/github-script@v8
        with:
          script: |
            const key = '${{ matrix.tenant }}/${{ matrix.environment }}';
            const title = `Drift detected in ${key}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Terraform plan found drift in \`${key}\` (exit code 2) — live infra differs from git. Investigate or re-run the deploy pipeline.\n\n[Workflow run](${url})`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            if (!issues.find(i => i.title === title)) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Fail on plan error
        if: steps.drift.outputs.exitcode == '1'
        run: |
          echo "::error::terraform plan errored for ${{ matrix.tenant }}/${{ matrix.environment }}"
          exit 1

  # --- Shared roots: the runtime plane and the tenant namespaces, one state per env ---
  detect-shared:
    if: ${{ vars.WIF_PROVIDER != '' }}
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, acc, prod]
        root:
          - { dir: terraform/runtime, prefix: runtime }
          - { dir: terraform/tenant-runtime, prefix: tenant-runtime }
    runs-on: ubuntu-latest
    env:
      # TF_VAR_* like the reusable workflows — each root reads only the ones it declares.
      TF_VAR_environment: ${{ matrix.environment }}
      TF_VAR_billing_account: ${{ vars.BILLING_ACCOUNT }}
      TF_VAR_runtime_folder_id: ${{ vars.RUNTIME_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PLANNER_SA }}

      - name: Auth git for private modules
        env:
          TOKEN: ${{ secrets.MODULES_READ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Detect drift (${{ matrix.root.prefix }} / ${{ matrix.environment }})
        id: drift
        working-directory: ${{ matrix.root.dir }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ matrix.root.prefix }}/${{ matrix.environment }}"
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open drift issue
        if: steps.drift.outputs.exitcode == '2'
        uses: actions/github-script@v8
        with:
          script: |
            const key = '${{ matrix.root.prefix }}/${{ matrix.environment }}';
            const title = `Drift detected in ${key}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Terraform plan found drift in \`${key}\` (exit code 2) — live infra differs from git. Investigate or re-run the deploy pipeline.\n\n[Workflow run](${url})`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            if (!issues.find(i => i.title === title)) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Fail on plan error
        if: steps.drift.outputs.exitcode == '1'
        run: |
          echo "::error::terraform plan errored for ${{ matrix.root.prefix }}/${{ matrix.environment }}"
          exit 1

  # --- Orphan workspaces (ADR-0026): state with no registry entry behind it ---
  # The failure mode the offboard pipeline exists to prevent, checked independently anyway: a
  # tenant workspace whose slug is in NO tenant YAML (deleted registry entry, renamed slug, or a
  # half-finished manual teardown) is invisible to every other job here — plan/apply/drift all
  # fan out FROM the registry, so registry-less state is never planned again and its resources
  # bill forever. `_expected` (scripts/list-tenant-envs.rb) includes offboarding-flagged tenants:
  # mid-offboard workspaces are a known state, not orphans.
  orphan-workspaces:
    if: ${{ vars.WIF_PROVIDER != '' }}
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, acc, prod]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PLANNER_SA }}

      - name: Auth git for private modules
        env:
          TOKEN: ${{ secrets.MODULES_READ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: List workspaces vs registry (${{ matrix.environment }})
        id: orphans
        working-directory: terraform/tenants
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=tenants/${{ matrix.environment }}"
          expected=$(ruby ../../scripts/list-tenant-envs.rb \
            | ruby -rjson -e 'puts (JSON.parse(STDIN.read).dig("_expected", ARGV[0]) || []).join(" ")' "${{ matrix.environment }}")
          echo "expected in ${{ matrix.environment }}: ${expected:-<none>}"
          orphans=""
          for ws in $(terraform workspace list | sed 's/^[* ] *//'); do
            [ "$ws" = "default" ] && continue
            case " ${expected} " in *" ${ws} "*) continue ;; esac
            terraform workspace select "$ws"
            count=$(terraform state list | wc -l | tr -d ' ')
            echo "::warning::orphan workspace '${ws}' in tenants/${{ matrix.environment }} (${count} resources in state)"
            orphans="${orphans}\`${ws}\` (${count} resources), "
          done
          echo "orphans=${orphans%, }" >> "$GITHUB_OUTPUT"

      - name: Open orphan-workspace issue
        if: steps.orphans.outputs.orphans != ''
        uses: actions/github-script@v8
        with:
          script: |
            const title = `Orphan tenant workspaces in ${'${{ matrix.environment }}'}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Workspaces with state but no registry entry in \`tenants/\`: ${'${{ steps.orphans.outputs.orphans }}'}.\n\n` +
              `Nothing plans or applies these anymore — any resources still in their state are live, unmanaged, and billing. ` +
              `If this is a half-finished offboard, re-run the offboard pipeline (idempotent); see docs/runbooks/tenant-offboard.md.\n\n[Workflow run](${url})`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            if (!issues.find(i => i.title === title)) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
