name: reusable-plan

# Read-only plan for one root + one environment, plus the OPA gate. Root-agnostic: callers point
# it at the tenant root or the runtime root. Runs as the PLANNER SA (read-only, any branch — D12).
# Variables are passed via TF_VAR_* env, so each root reads only the ones it declares.

on:
  workflow_call:
    inputs:
      environment:
        description: dev | acc | prod
        required: true
        type: string
      root_dir:
        description: Terraform root to plan.
        required: false
        type: string
        default: terraform/tenants
      state_prefix:
        description: State key prefix (state object is <prefix>/<environment>).
        required: false
        type: string
        default: tenants
      workspace:
        description: Terraform workspace to select (per-tenant roots, ADR-0014). Empty = default.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: plan-${{ inputs.state_prefix }}-${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_billing_account: ${{ vars.BILLING_ACCOUNT }}
      TF_VAR_parent_folder_id: ${{ vars.PARENT_FOLDER_ID }}
      TF_VAR_keys_project_id: ${{ vars.KEYS_PROJECT_ID }}
      TF_VAR_runtime_folder_id: ${{ vars.RUNTIME_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PLANNER_SA }}

      - name: Auth git for private modules # no-op if MODULES_READ_TOKEN is unset (public repo)
        env:
          TOKEN: ${{ secrets.MODULES_READ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Terraform init
        working-directory: ${{ inputs.root_dir }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ inputs.state_prefix }}/${{ inputs.environment }}"

      - name: Select workspace # per-tenant roots (ADR-0014); state at <prefix>/<env>/<workspace>
        if: ${{ inputs.workspace != '' }}
        working-directory: ${{ inputs.root_dir }}
        run: terraform workspace select -or-create "${{ inputs.workspace }}"

      - name: Terraform plan
        working-directory: ${{ inputs.root_dir }}
        run: |
          terraform plan -input=false -lock=false -out=plan.tfplan
          terraform show -json plan.tfplan > plan.json
          terraform show -no-color plan.tfplan > plan.txt

      # The gate always uses the LATEST policy version in VERSIONS.md (or POLICY_REF if set), so it
      # never drifts behind the modules. Module source refs can't be dynamic; this isn't a module.
      - name: Resolve policy version
        id: policy
        run: |
          ref="${{ vars.POLICY_REF }}"
          if [ -z "$ref" ]; then
            ref=$(grep -oE '`v[0-9]+\.[0-9]+\.[0-9]+`' VERSIONS.md | tr -d '`' | sort -V | tail -1)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Policy gate (OPA)
        uses: ./.github/actions/opa-gate
        with:
          plan_json: ${{ inputs.root_dir }}/plan.json
          policy_ref: ${{ steps.policy.outputs.ref }}
          token: ${{ secrets.MODULES_READ_TOKEN }}

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const key = '${{ inputs.state_prefix }}-${{ inputs.environment }}-${{ inputs.workspace }}';
            const marker = `<!-- plan-${key} -->`;
            let plan = '(no plan output)';
            try { plan = fs.readFileSync('${{ inputs.root_dir }}/plan.txt', 'utf8'); } catch (e) {}
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';
            const body = `${marker}\n### Terraform plan — \`${key}\`\n<details><summary>show</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
