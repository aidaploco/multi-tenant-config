name: reusable-plan

# Read-only plan for one environment + the OPA gate. Called by pr.yml (matrix over envs) and by
# any other component that wants the same gated-plan behaviour. Runs as the PLANNER SA (read-only,
# assumable from any branch — ADR-0001 D12).

on:
  workflow_call:
    inputs:
      environment:
        description: dev | acc | prod
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC -> WIF
  pull-requests: write # post the plan as a PR comment

jobs:
  plan:
    name: plan-${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PLANNER_SA }}

      - name: Terraform init
        working-directory: terraform/tenants
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=tenants/${{ inputs.environment }}"

      - name: Terraform plan
        working-directory: terraform/tenants
        run: |
          terraform plan -input=false -lock=false \
            -var="environment=${{ inputs.environment }}" \
            -var="billing_account=${{ vars.BILLING_ACCOUNT }}" \
            -var="parent_folder_id=${{ vars.PARENT_FOLDER_ID }}" \
            -var="keys_project_id=${{ vars.KEYS_PROJECT_ID }}" \
            -out=plan.tfplan
          terraform show -json plan.tfplan > plan.json
          terraform show -no-color plan.tfplan > plan.txt

      - name: Policy gate (OPA)
        uses: ./.github/actions/opa-gate
        with:
          plan_json: terraform/tenants/plan.json
          policy_ref: ${{ vars.POLICY_REF || 'v0.3.0' }}
          token: ${{ secrets.POLICIES_READ_TOKEN }}

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ inputs.environment }}';
            const marker = `<!-- plan-${env} -->`;
            let plan = '(no plan output)';
            try { plan = fs.readFileSync('terraform/tenants/plan.txt', 'utf8'); } catch (e) {}
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';
            const body = `${marker}\n### Terraform plan — \`${env}\`\n<details><summary>show</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
