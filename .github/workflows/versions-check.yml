name: versions-check

# Fails the PR if any pinned module `?ref=` in terraform/ disagrees with VERSIONS.md. This is the
# automated guard that replaces "remember to keep them in sync" — drift cannot merge. Runs always
# (no WIF needed; it's just text), so it works even before the platform is configured.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enforce module refs match VERSIONS.md
        run: ./scripts/check-versions.sh
