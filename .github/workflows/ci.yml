name: ci

# Pre-merge code checks — no cloud credentials, so this runs on every PR (unlike the
# credential-gated plan/apply CD, which is dormant until configured). Format, validate, the mocked
# `terraform test` suites, and tflint. The OPA policy unit tests live in platform-modules' CI.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Secret scan over the full git history, before anything else runs. Pinned release + checksum
  # (no third-party action). Fails the build on any finding; findings are redacted in the log.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          ver=8.30.1
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          echo "${sha}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="--all" .

  fmt:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive

  validate-test:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      # If platform-modules is private, `terraform init` needs git creds to fetch the pinned
      # modules. Set MODULES_READ_TOKEN (a read token). If the repo is public, leave it unset.
      - name: Auth git for private modules
        env:
          TOKEN: ${{ secrets.MODULES_READ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - name: validate every root + run its tests
        # init -backend=false fetches the pinned platform-modules from git (no cloud creds needed).
        run: |
          set -euo pipefail
          roots="bootstrap terraform/tenants terraform/tenants/modules/tenant terraform/runtime terraform/tenant-runtime"
          for d in $roots; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            if ls "$d"/tests/*.tftest.hcl >/dev/null 2>&1; then
              terraform -chdir="$d" test
            fi
            echo "::endgroup::"
          done

  tflint:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --recursive

  # Data + boundary guards — pure Ruby (preinstalled on runners), no cloud, fail in seconds:
  # the registry invariants (slug==filename, known envs/types), the gitops ownership boundary
  # (no Terraform-owned policy kinds in the Config-Sync-synced tree, ADR-0012 D12-3), the
  # NetworkPolicy shape guard (no fully-empty allow-all rules — covers the one writer the
  # ADR-0023 admission constraint deliberately trusts: the platform itself), the renderer's
  # golden-file tests, the payload drift check — a registry edit without a re-render, or
  # a hand edit of a generated payload file, cannot merge (ADR-0017 D17-1) — and the eval
  # gate: a PR changing a unit's effective prod `version` must carry a passing eval report
  # for that exact release (ADR-0026 D26-4; PR-only, it diffs against the PR base).
  guards:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ruby scripts/check-registry.rb
      - run: ruby scripts/check-gitops-ownership.rb
      - run: ruby scripts/check-netpol-shape.rb
      - run: ruby scripts/test-render-payload.rb
      - run: ruby scripts/render-payload.rb --check
      - run: ruby scripts/test-check-eval-gate.rb
      - name: Eval gate (prod promotions carry eval evidence)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          ruby scripts/check-eval-gate.rb --base "${{ github.event.pull_request.base.sha }}"
