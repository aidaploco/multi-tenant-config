name: pr

# On every PR: plan all environments of both roots (tenant + runtime) and run the policy gate, in
# parallel. The reusable workflow does the work; this file just fans out. Diffs are posted as
# per-root, per-env comments.
#
# Jobs are gated on WIF_PROVIDER being set, so the pipeline stays DORMANT (skipped, not failed)
# until the one-time repo setup is done (see workflows/README.md). No credentials = nothing to run.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan-tenants:
    if: ${{ vars.WIF_PROVIDER != '' }}
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, acc, prod]
    uses: ./.github/workflows/reusable-plan.yml
    with:
      environment: ${{ matrix.environment }}
    secrets: inherit

  plan-runtime:
    if: ${{ vars.WIF_PROVIDER != '' }}
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, acc, prod]
    uses: ./.github/workflows/reusable-plan.yml
    with:
      environment: ${{ matrix.environment }}
      root_dir: terraform/runtime
      state_prefix: runtime
    secrets: inherit

  plan-tenant-runtime:
    if: ${{ vars.WIF_PROVIDER != '' }}
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, acc, prod]
    uses: ./.github/workflows/reusable-plan.yml
    with:
      environment: ${{ matrix.environment }}
      root_dir: terraform/tenant-runtime
      state_prefix: tenant-runtime
    secrets: inherit
