name: opa-gate
description: Gate a Terraform plan against the OPA policies, sourced PINNED from multi-tenant-platform.

# The pre-flight policy gate (ADR-0001 D8). Policies are authored once in multi-tenant-platform as the
# single source of truth and consumed here by a pinned ref — never copied into this repo. A plan
# that trips any `deny` rule fails the job, so it never reaches apply (not even in dev).

inputs:
  plan_json:
    description: Path (from repo root) to the `terraform show -json` output.
    required: true
  policy_ref:
    description: Pinned git ref of multi-tenant-platform to read policies from (e.g. v0.1.0).
    required: true
  policy_repo:
    description: Repo holding the policies.
    required: false
    default: aidaploco/multi-tenant-platform
  policy_path:
    description: Path to the policy dir within that repo.
    required: false
    default: policies
  conftest_version:
    description: Pinned Conftest version.
    required: false
    default: 0.56.0
  token:
    description: Token to read policy_repo if it is private. Defaults to the job's GITHUB_TOKEN.
    required: false
    default: ""
  allow_destroy:
    description: >-
      Set "true" ONLY from the deliberate teardown/offboarding pipeline. Waives the
      destroy-count threshold (policies >= v0.10.0) via external conftest data — a PR can never
      waive its own gate from plan content. Every other deny still applies.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Checkout policies (pinned)
      uses: actions/checkout@v5
      with:
        repository: ${{ inputs.policy_repo }}
        ref: ${{ inputs.policy_ref }}
        path: .opa-policies
        token: ${{ inputs.token != '' && inputs.token || github.token }}

    - name: Install Conftest
      shell: bash
      run: |
        ver='${{ inputs.conftest_version }}'
        curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${ver}/conftest_${ver}_Linux_x86_64.tar.gz" \
          | tar -xz conftest
        sudo mv conftest /usr/local/bin/conftest

    - name: Gate plan
      shell: bash
      run: |
        if [ "${{ inputs.allow_destroy }}" = "true" ]; then
          echo '{"exceptions": {"allow_destroy_over_threshold": true}}' > .opa-exceptions.json
          conftest test "${{ inputs.plan_json }}" \
            --policy ".opa-policies/${{ inputs.policy_path }}" --data .opa-exceptions.json
        else
          conftest test "${{ inputs.plan_json }}" --policy ".opa-policies/${{ inputs.policy_path }}"
        fi
