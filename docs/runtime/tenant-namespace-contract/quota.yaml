# A noisy tenant can't starve the shared cluster: a quota caps total requests, and a LimitRange
# gives every container a sane default request/limit. Values are the baseline; tune per tenant.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: abf
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limits
  namespace: abf
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
